name: Article link audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit August–September article URLs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract and test every article URL
        id: audit
        shell: bash
        run: |
          set -u
          mkdir -p audit
          python3 - <<'PY'
          import csv
          import re
          from pathlib import Path

          pattern = re.compile(r'https?://[^\s<>\)\]\}\"\x27]+')
          urls = set()
          for path in sorted(Path('_posts').glob('2026-08-*.md')) + sorted(Path('_posts').glob('2026-09-*.md')):
              urls.update(match.rstrip('.,;:!?') for match in pattern.findall(path.read_text(encoding='utf-8')))
          with open('audit/urls.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(sorted(urls)) + ('\n' if urls else ''))
          PY
          printf 'url,final_url,http_code,result\n' > audit/article-link-audit.csv
          failures=0
          while IFS= read -r url; do
            response=$(curl --location --silent --show-error --output /dev/null --write-out '%{url_effective}|%{http_code}' --connect-timeout 15 --max-time 45 --retry 2 --retry-delay 2 --user-agent 'Callnovo-Link-Audit/1.0' "$url" 2>&1)
            curl_exit=$?
            if [ $curl_exit -ne 0 ]; then
              final_url=''
              code="curl_error_${curl_exit}"
              result='REVIEW'
              failures=$((failures + 1))
            else
              final_url=${response%|*}
              code=${response##*|}
              if [ "$code" = '200' ]; then
                result='PASS'
              else
                result='FAIL'
                failures=$((failures + 1))
              fi
            fi
            printf '%s\t%s\t%s\t%s\n' "$url" "$final_url" "$code" "$result" >> audit/article-link-audit.tsv
          done < audit/urls.txt
          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = []
          tsv = Path('audit/article-link-audit.tsv')
          if tsv.exists():
              for line in tsv.read_text(encoding='utf-8').splitlines():
                  rows.append(line.split('\t', 3))
          with open('audit/article-link-audit.csv', 'w', newline='', encoding='utf-8') as f:
              writer = csv.writer(f)
              writer.writerow(['url', 'final_url', 'http_code', 'result'])
              writer.writerows(rows)
          passed = sum(row[3] == 'PASS' for row in rows)
          failed = len(rows) - passed
          lines = [
              '# Article link audit',
              '',
              'Scope: every HTTP(S) URL extracted from August and September 2026 post files.',
              '',
              f'- Unique URLs checked: {len(rows)}',
              f'- Final 200 passes: {passed}',
              f'- Failures or manual-review results: {failed}',
              '',
              '## Non-passing results',
              '',
              '| URL | Final URL | HTTP result | Classification |',
              '|---|---|---:|---|',
          ]
          for url, final_url, code, result in rows:
              if result != 'PASS':
                  lines.append(f'| {url} | {final_url or "—"} | {code} | {result} |')
          if failed == 0:
              lines.append('| None | — | 200 | PASS |')
          Path('audit/article-link-audit.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Upload complete audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-link-audit
          path: audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f audit/article-link-audit.md ]; then
            cat audit/article-link-audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Audit report could not be generated; inspect the extraction step log.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail when review is required
        if: steps.audit.outputs.failures != '0'
        shell: bash
        run: exit 1
