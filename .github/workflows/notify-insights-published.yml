name: Refresh root site after publishing

# When a new article is pushed to _posts, wait until GitHub Pages has rebuilt and
# the post is actually visible in the live feed, then update the article list on
# the host-root homepage in callnovo-cc/callnovo-cc.github.io.
#
# Why the wait: the root homepage list is generated from THIS site's live
# feed.xml. Acting before the Pages build finishes would regenerate the list from
# a feed that does not yet contain the new post, leaving the homepage a post
# behind until its next scheduled run.
#
# Why a deploy key rather than a PAT: GITHUB_TOKEN cannot write to another
# repository, and a personal access token would be scoped to the whole account.
# INSIGHTS_DEPLOY_KEY is an SSH key whose write access is limited to
# callnovo-cc.github.io and nothing else. Revoke it any time under that repo's
# Settings > Deploy keys.
#
# The regeneration logic itself lives in the root repository
# (scripts/refresh_insights.py) and is run from the checkout below, so there is
# only ever one copy of it.

on:
  push:
    branches: [main]
    paths:
      - "_posts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-root-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Wait for the newest post to appear in the live feed
        id: wait
        run: |
          set -euo pipefail

          newest="$(ls _posts/*.md | sort | tail -1)"
          base="$(basename "${newest}" .md)"
          year="${base:0:4}"; month="${base:5:2}"; day="${base:8:2}"
          slug="${base:11}"
          url="https://callnovo-cc.github.io/blog/${year}/${month}/${day}/${slug}/"
          echo "Newest post file: ${newest}"
          echo "Expecting live URL: ${url}"

          for attempt in $(seq 1 30); do
            if curl -sSf --max-time 30 \
                 https://callnovo-cc.github.io/blog/feed.xml \
                 | grep -qF "${url}"; then
              echo "Live in feed after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}/30: not in feed yet; waiting 20s."
            sleep 20
          done

          echo "::warning::Post did not appear in the feed within 10 minutes." \
               "Continuing anyway - the refresh reads the live feed, and the root" \
               "site's twice-daily schedule will catch it if the build is still" \
               "pending."

      - name: Load the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.INSIGHTS_DEPLOY_KEY }}

      - name: Check out the root site
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 \
            git@github.com:callnovo-cc/callnovo-cc.github.io.git root-site
          echo "Root site checked out."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the article list
        working-directory: root-site
        run: python3 scripts/refresh_insights.py

      - name: Commit and push if the article set moved
        working-directory: root-site
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No change - the root homepage already lists this article."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml sitemap-site.xml
          git commit -m "Refresh Insights article list on the root homepage [skip ci]"
          git push
          echo "Root homepage updated. GitHub Pages will rebuild shortly."
