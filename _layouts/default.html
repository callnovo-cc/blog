<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}

  <!-- Jekyll SEO tag (auto-generates additional meta) -->
  {% seo %}

  <!-- RSS -->
  {% feed_meta %}

  <!-- Sitemap hint -->
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <nav class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="site-name">{{ site.title }}</a>
      <a href="{{ '/' | relative_url }}" class="nav-link">Blog</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>© {{ 'now' | date: "%Y" }} Callnovo Contact Center · <a href="https://callnovo.ai" target="_blank" rel="noopener">callnovo.ai</a></p>
  </footer>
</body>
</html>
