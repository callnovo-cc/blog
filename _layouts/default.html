<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="site-shell header-shell">
      <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Blog</a>
        <a href="https://callnovo.ai/" target="_blank" rel="noopener noreferrer">Callnovo.ai</a>
        <a href="https://callnovo.ai/contact/" target="_blank" rel="noopener noreferrer">Contact</a>
      </nav>
    </div>
  </header>

  <main id="content" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-shell footer-shell">
      <p>{{ site.title }} — Practical insights on outsourced customer support, AI-powered CX, and global contact center operations.</p>
    </div>
  </footer>
</body>
</html>
