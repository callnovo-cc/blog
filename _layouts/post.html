---
layout: default
---

<article class="article-wrap">
  <div class="site-shell site-shell-article">
    <header class="article-header">
      <p class="post-meta">{{ page.date | date: "%b %-d, %Y" }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.description %}
        <p class="article-dek">{{ page.description }}</p>
      {% endif %}
    </header>

    <div class="article-body">
      {{ content }}
    </div>
  </div>
</article>
